plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nobi.litebrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.nobi.litebrowser"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally empty: no third-party libraries.
}
